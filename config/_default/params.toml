# SITE SETUP
# Documentation: https://sourcethemes.com/academic/

# marketing
microsoft_clarity = ""

# Color theme.
#   Choose from `default`, `ocean`, `forest`, `dark`, `apogee`, `1950s`, `coffee`, `cupcake`, `strawberry`.
color_theme = "default"
# Enable users to switch between day and night mode?
day_night = true

# Font style.
#   Choose from `default`, `classic`, or `playfair`.
font = "classic"

# Description for social sharing and search engines. If undefined, superuser role is used in place.
description = "Assistant Professor at Universidad Industrial de Santander (UIS) & Founder/Leader of PI Group (Inverse Problems Research Group)."

# Default image for social sharing and search engines. Place image in `static/img/` folder and specify image name here.
sharing_image = ""

# Twitter username (without @). Used when a visitor shares your site on Twitter.
twitter = ""

# Display a logo in navigation bar rather than title (optional).
#   To enable, place an image in `static/img/` and reference its filename below. To disable, set the value to "".
logo = ""

# Enable global source code highlighting? true/false
# Documentation: https://sourcethemes.com/academic/docs/writing-markdown-latex/#highlighting-options
highlight = true

# Enable global LaTeX math rendering?
#   If false, you can enable it locally on a per page basis.
math = false

# Privacy pack
#   Show a cookie consent message to visitors
#   Anonymize IP in Google Analytics (if enabled)
privacy_pack = false

# Date and time format (refer to https://sourcethemes.com/academic/docs/customization/#date-format )
#   Examples: "Mon, Jan 2, 2006" or "2006-01-02"
date_format = "Jan 2, 2006"
#   Examples: "3:04 pm" or "15:04"
time_format = "3:04 PM"

############################
##  Contact Widget setup  ##
############################

# Enter contact details (optional). To hide a field, clear it to "".
email = "jbacquin@uis.edu.co"
basin_id = ""
phone = ""
address = "Escuela de Ingeniería de Sistemas e Informática, Universidad Industrial de Santander (UIS), Cra. 27 Calle 9, Bucaramanga, Santander, Colombia"

# Office hours: use `<br>` to insert a line break, or set to "" to remove office hours
office_hours = ""

# Enter the verified booking URL when available. Leave blank so no non-functional booking link is shown.
appointment_url = ""

# Contact links
#   Set to `[]` to disable, or comment out unwanted lines with a hash `#`.
contact_links = []

# Map provider:
#   0: No map
#   1: Google Maps
#   2: OpenStreetMap (Mapnik)
#   3: OpenStreetMap (Mapbox)
map = 2
map_api_key = ""
latitude = "7.1407"
longitude = "-73.1210"
zoom = 16

############################
## Plugins                ##
############################

plugins_css = []
plugins_js  = []

############################
## Advanced options       ##
############################

gravatar = false
menu_align_right = true
reading_time = true
comment_count = true
section_pager = false
docs_section_pager = true
sharing = true

# Configuration of publication pages.
[publications]
  date_format = "January 2006"
  citation_style = "apa"

# Configuration of project pages.
[projects]
  post_view = 3
  publication_view = 3
  talk_view = 2

# Search.
[search]
  engine = 0

  [search.algolia]
    app_id = ""
    api_key = ""
    index_name = ""
    show_logo = false
